services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-290926
    restart: always
    ports:
      - "${MONGO_DB_PORT}:27017" # port machine hôte : port conteneur
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./data/mongo:/data/db